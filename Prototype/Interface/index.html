<style>
/* Layout: a jewellery-house showroom — live 3D display stand on the left, the GemXpert VR panel on the right
   (stacks below the stage on phones). Single deliberate dark look, same tokens as the Unity UITheme. */
:root {
  color-scheme: dark;
  --bg: #0A0A0C;
  --surface: #141417;
  --surface-2: #1C1B20;
  --surface-3: #25232A;
  --line: rgba(201, 164, 92, 0.24);
  --line-strong: rgba(201, 164, 92, 0.62);
  --gold: #C9A45C;
  --gold-bright: #E6C983;
  --gold-deep: #8E6F35;
  --ivory: #F3EEE5;
  --muted: #9D978C;
  --faint: #6B665E;
  --on-gold: #141210;
  --ok: #73C291;
  --warn: #E2B04A;
  --bad: #E0675F;
  --font-display: "Marcellus", "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 16px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ivory); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

.app {
  height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.brand-mark { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.32em; color: var(--gold-bright); }
.brand-sub { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
        font-size: 12px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

/* ---------- main layout */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); gap: 14px; }

.stage { position: relative; min-height: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
         background: radial-gradient(ellipse 70% 60% at 50% 32%, #2B2520 0%, #17141A 48%, #0B0A0D 85%); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; flex-wrap: wrap; }
.caption { background: rgba(10, 10, 12, 0.66); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px); max-width: 100%; }
.caption-title { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.06em; }
.caption-spec { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.fit { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
       background: rgba(10, 10, 12, 0.72); border: 1px solid currentColor; align-self: flex-start; }
.fit.ok { color: var(--ok); } .fit.warn { color: var(--warn); } .fit.bad { color: var(--bad); }
.toolbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px;
           background: rgba(10, 10, 12, 0.78); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(6px);
           max-width: calc(100% - 28px); overflow-x: auto; }
.tool { border: 0; background: transparent; color: var(--ivory); padding: 8px 12px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; }
.tool:hover { background: var(--surface-3); }
.tool[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); font-weight: 600; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted);
           font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--bg); transition: opacity 0.5s; }
.loading.done { opacity: 0; pointer-events: none; }
.toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line-strong);
         color: var(--ivory); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: calc(100% - 28px); text-align: center; }
.toast.show { opacity: 1; }

/* ---------- the VR panel */
.panel { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.panel-head { display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 56px; }
.panel-head h1 { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: 0.26em; text-transform: uppercase; text-wrap: balance; }
.quiet { border: 0; background: transparent; color: var(--gold-bright); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 6px; border-radius: 8px; }
.quiet:hover { background: var(--surface-2); }
.quiet[hidden] { display: none !important; }
.panel-body { flex: 1; overflow-y: auto; padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 18px; }
.panel-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }
.panel-foot strong { font-family: var(--font-display); font-weight: 400; color: var(--gold); letter-spacing: 0.28em; }

.eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); margin: 0; }
h2.section { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { border-radius: 12px; padding: 13px 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; border: 1px solid var(--gold-deep); background: var(--surface-2); }
.btn:hover { background: var(--surface-3); border-color: var(--gold); }
.btn.primary { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.primary:hover { background: var(--gold-bright); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* welcome */
.welcome { align-items: center; text-align: center; justify-content: center; flex: 1; gap: 14px; padding-block: 20px; }
.welcome .mark { font-family: var(--font-display); font-size: clamp(38px, 7vw, 54px); letter-spacing: 0.3em; color: var(--gold-bright); margin-right: -0.3em; line-height: 1.1; }
.welcome .tag { letter-spacing: 0.08em; }
.rule { width: 120px; height: 1px; background: var(--gold); opacity: 0.7; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--gold-deep); background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile:hover { border-color: var(--gold); background: var(--surface-3); }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--gold-bright); letter-spacing: 0.03em; }
.tile span { font-size: 12.5px; color: var(--muted); }
.tile.wide { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }

/* option cards */
.cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
.card { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 8px 12px 8px 8px; }
.card:hover { border-color: var(--gold-deep); }
.card[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.card img { width: 92px; height: 74px; object-fit: cover; border-radius: 9px; background: #0d0c0f; }
.card b { font-family: var(--font-display); font-weight: 400; font-size: 17px; display: block; }
.card .meta { font-size: 12px; color: var(--gold); letter-spacing: 0.04em; }
.card p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

.gems { display: grid; grid-template-columns: 1fr; gap: 8px; }
.gem { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.gem[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
          background: conic-gradient(from 20deg, var(--c1), var(--c2), var(--c1), var(--c3), var(--c1), var(--c2), var(--c1)); }
.gem b { display: block; font-weight: 600; }
.gem small { color: var(--muted); font-size: 12px; }
.gem .num { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); text-align: right; }

.shapes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.shape { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; font-size: 12.5px; }
.shape svg { width: 34px; height: 34px; }
.shape[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold-bright); }
.shape:disabled { opacity: 0.38; cursor: not-allowed; }
.note { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--gold-deep); padding-left: 10px; }

/* sliders */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.field label { font-weight: 600; font-size: 13.5px; }
.val { font-family: var(--font-mono); font-size: 13px; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
.hint { font-size: 11.5px; color: var(--faint); font-family: var(--font-mono); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: var(--track, var(--surface-3)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--gold-bright); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--gold); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--gold-bright); border: 2px solid var(--bg); }
input[type="range"]:disabled { opacity: 0.4; }

.metals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metal { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 11.5px; text-align: center; }
.metal i { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #fff 0%, var(--m) 30%, color-mix(in srgb, var(--m) 55%, #000) 100%); }
.metal[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }

.fitbox { border-radius: 12px; padding: 12px 14px; border: 1px solid currentColor; background: rgba(0,0,0,0.2); }
.fitbox.ok { color: var(--ok); } .fitbox.warn { color: var(--warn); } .fitbox.bad { color: var(--bad); }
.fitbox b { display: block; font-size: 14px; }
.fitbox ul { margin: 4px 0 0; padding-left: 18px; color: var(--ivory); font-size: 12.5px; }

dl.spec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; }
dl.spec dt { color: var(--muted); font-size: 12.5px; }
dl.spec dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
dl.spec dd.mono { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }

.compare { display: flex; gap: 8px; flex-wrap: wrap; }
.cmp { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 12px; text-align: left; display: flex; gap: 8px; align-items: center; }
.cmp .swatch { width: 18px; height: 18px; }
.cmp.active { border-color: var(--gold); }

.saved { display: flex; flex-direction: column; gap: 8px; }
.saved-item { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.saved-item b { font-weight: 600; }
.saved-item small { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }
.empty { color: var(--muted); text-align: center; padding: 24px 10px; border: 1px dashed var(--line); border-radius: 12px; }

/* design from a photo */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.drop { display: grid; place-items: center; min-height: 150px; border: 1px dashed var(--line-strong); border-radius: 14px; background: var(--surface-2);
        color: var(--muted); text-align: center; cursor: pointer; overflow: hidden; padding: 10px; }
.drop:hover { border-color: var(--gold); color: var(--ivory); }
.drop img { max-height: 220px; width: auto; max-width: 100%; border-radius: 10px; }
.drop small { color: var(--faint); }
#photoIn:focus-visible + .row, .drop:focus-within { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
.findings { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.findings ul { margin: 0 0 4px; padding-left: 18px; font-size: 13px; }
.findings ul.warn li { color: var(--warn); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.form label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ivory); grid-column: 1 / -1; }
.form input[type="text"], .form select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; color: var(--ivory); font-weight: 500; min-width: 0; }
.form label:first-child { grid-column: 1 / -1; }
code { font-family: var(--font-mono); font-size: 12px; color: var(--gold-bright); }

.device { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.device-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.readout { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 4px 12px; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.readout span:nth-child(4n+1) { color: var(--muted); }
pre.packet { margin: 0; padding: 10px; border-radius: 10px; background: #0c0c0e; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-x: auto; white-space: pre; }
.sim-badge { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 2px 6px; }

ol.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; counter-increment: s; }
ol.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-display); color: var(--gold); font-size: 20px; }
ol.steps b { display: block; }
ol.steps span { color: var(--muted); font-size: 13px; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.keys kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; color: var(--gold-bright); white-space: nowrap; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 54vh; min-height: 320px; }
  .panel-body { overflow: visible; }
  .brand-sub { display: none; }
  .panel-head { grid-template-columns: 76px minmax(0, 1fr) 76px; padding-inline: 8px; }
  .panel-head h1 { font-size: 13px; letter-spacing: 0.14em; }
  .quiet { font-size: 11px; letter-spacing: 0.06em; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const GEM_FILES = { round: "Gem_Round", oval: "Gem_Oval", cushion: "Gem_Cushion", pear: "Gem_Pear", emerald: "Gem_EmeraldCut", princess: "Gem_Princess" };

  round: '<circle cx="17" cy="17" r="13"/><polygon points="17,7 26,17 17,27 8,17"/>',
  oval: '<ellipse cx="17" cy="17" rx="10" ry="14"/><polygon points="17,6 24,17 17,28 10,17"/>',
  cushion: '<rect x="4" y="4" width="26" height="26" rx="9"/><rect x="11" y="11" width="12" height="12" rx="3"/>',
  pear: '<path d="M17 31 C9 23 7 18 7 13 a10 10 0 0 1 20 0 c0 5 -2 10 -10 18z"/><polygon points="17,8 23,15 17,24 11,15"/>',
  emerald: '<polygon points="11,3 23,3 28,8 28,26 23,31 11,31 6,26 6,8"/><polygon points="13,9 21,9 22,10 22,24 21,25 13,25 12,24 12,10"/>',
  princess: '<rect x="5" y="5" width="24" height="24"/><path d="M5 5 L29 29 M29 5 L5 29"/>',
};

let CAT, META;
const byId = (list, id) => list.find((x) => x.id === id);
// Custom rings (designed from a photo or by hand) live beside the catalogue and behave like catalogue rings.
const CUSTOM_KEY = "gemxpert.customRings.v1";
let customRings = [];

  const reasons = [];

    const names = m.supportedShapes.map((id) => shapeDef(id).displayName.toLowerCase());
    return { status: "bad", title: "Does not fit this setting", reasons: [`The ${r.displayName} setting holds ${listJoin(names)} stones only.`] };
  }
  if (L < m.minLengthMm) reasons.push(`Too short: ${L.toFixed(1)} mm (needs at least ${m.minLengthMm} mm).`);
  if (L > m.maxLengthMm) reasons.push(`Too long: ${L.toFixed(1)} mm (the head takes up to ${m.maxLengthMm} mm).`);
  if (W < m.minWidthMm) reasons.push(`Too narrow: ${W.toFixed(1)} mm (needs at least ${m.minWidthMm} mm).`);
  if (W > m.maxWidthMm) reasons.push(`Too wide: ${W.toFixed(1)} mm (the head takes up to ${m.maxWidthMm} mm).`);
  if (D > m.maxDepthMm) reasons.push(`Too deep: ${D.toFixed(2)} mm total depth (maximum ${m.maxDepthMm} mm).`);
  if (reasons.length) return { status: "bad", title: "Does not fit this setting", reasons };

  if (W - m.minWidthMm < margin || m.maxWidthMm - W < margin) near.push("Width is at the edge of what the head can hold.");
  if (m.maxDepthMm - D < margin) near.push("Pavilion sits very close to the band.");
  if (g.hardnessMohs < 8 && (r.id === "solitaire" || r.id === "prong")) near.push(`${g.displayName} (${g.hardnessMohs} Mohs) is softer than corundum; a bezel or halo protects it better.`);

    const mb = new MB(), half = accentSize / 2 + 0.22, bottom = zAcc - accent.pavilion - 0.15, top = zAcc - 0.06;
    mb.add(sweepClosed(pts, nrm, [[off - half, bottom + 0.1], [off - half + 0.1, bottom], [off + half - 0.1, bottom], [off + half, bottom + 0.1], [off + half, top], [off - half, top]]));

      const mid = [(start[0] + end[0]) / 2 + n[0] * 0.5, (start[1] + end[1]) / 2 + n[1] * 0.5, (start[2] + end[2]) / 2];

async function loadGemGeometry(shapeId) {
  if (gemGeo[shapeId]) return gemGeo[shapeId];
  const gltf = await loadModel(`models/${GEM_FILES[shapeId]}.json`);
  let mesh = null;
  gltf.scene.traverse((o) => { if (o.isMesh && !mesh) mesh = o; });
  gemGeo[shapeId] = mesh.geometry;
  return mesh.geometry;
}

async function loadRing(id) {
  const r = ringById(id);
  let root;
  if (r.custom) {
    const built = GEN.build(r.spec, META.gemCuts, await loadGemGeometry("round"));
    customInfo[r.id] = built.info;
    root = built.root;
  } else {
    if (!ringCache[id]) ringCache[id] = await loadModel(`models/${RING_FILES[id]}.json`);
    root = ringCache[id].scene.clone(true);
  }
  if (ringRoot) pivot.remove(ringRoot);
  ringRoot = root;
  ringRoot.scale.setScalar(1000);   // rings are in metres (GLB and generator alike); the stage works in millimetres
  const metalPrefixes = r.metalRendererPrefixes, accentPrefixes = r.accentStoneRendererPrefixes || [];
  ringRoot.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.name;
    if (accentPrefixes.some((p) => n.startsWith(p))) o.material = accentMat;
    else if (metalPrefixes.some((p) => n.startsWith(p))) o.material = metalMat;
  });
  // Wrap the centre head so it can follow the stone's footprint (the stone itself is a sibling).
  const mount = ringRoot.getObjectByName("GemMount_Center");
  headScaler = new THREE.Group();
  headScaler.name = "HeadScaler";
  [...mount.children].forEach((c) => headScaler.add(c));
  mount.add(headScaler);
  centerGem = new THREE.Mesh(await loadGemGeometry(state.shapeId), gemMat);
  centerGem.name = "CenterGem";
  mount.add(centerGem);
  // Fixed side stones (three-stone)
  sideGems = [];
  for (const m of r.mounts.filter((x) => x.role === "side" && x.fixedShapeId)) {
    const node = ringRoot.getObjectByName(`GemMount_${m.id}`);
    if (!node) continue;
    const g = new THREE.Mesh(await loadGemGeometry(m.fixedShapeId), accentMat);
    const L = m.fixedLengthMm;
    g.scale.set(L, L * depthRatio(m.fixedShapeId), L);
    node.add(g);
    sideGems.push(g);
  }
  pivot.add(ringRoot);
}

let loadedRingId = null, loadedShapeId = null;
async function syncStage(forceRing = false) {
  if (forceRing || loadedRingId !== state.ringId) { await loadRing(state.ringId); loadedRingId = state.ringId; loadedShapeId = state.shapeId; }
  if (loadedShapeId !== state.shapeId) { centerGem.geometry = await loadGemGeometry(state.shapeId); loadedShapeId = state.shapeId; }
  const m = metalDef(), g = gemDef();
  metalMat.color.set(m.colorHex);
  metalMat.roughness = Math.max(0.04, (1 - m.smoothness) * 0.6);
  styleGem(gemMat, g);
  const head = headDefaults(ring());
  headScaler.scale.set(state.widthMm / head.W, 1, state.lengthMm / head.L);
  centerGem.scale.set(state.widthMm, depthMm(), state.lengthMm);
  centerGem.position.set(state.seat.x * 0.001, state.seat.y * 0.001, state.seat.z * 0.001);
  refreshHud();
}

function refreshHud() {
  const r = ring(), g = gemDef(), s = shapeDef(), m = metalDef(), f = checkFit();
  document.getElementById("capTitle").textContent = r.displayName;
  document.getElementById("capSpec").textContent =
    `${g.displayName} · ${s.displayName} ${state.lengthMm.toFixed(1)} × ${state.widthMm.toFixed(1)} × ${depthMm().toFixed(2)} mm · ${m.displayName}`;
  const chip = document.getElementById("fitChip");

// camera tweening
let tween = null;
function flyTo(pos, target, ms = 700) {
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), start: performance.now(), ms };
}
function setAutoRotate(on) { controls.autoRotate = on; document.getElementById("tRotate").setAttribute("aria-pressed", String(on)); }

// wearable simulation
const wear = { connected: false, auto: true, yaw: 0, pitch: 0, roll: 0, zero: { yaw: 0, pitch: 0, roll: 0 }, battery: 87, last: null, packet: null,
  real: false, ws: null, q: null, host: null };   // real = live ESP32 over WiFi
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (tween) {
    const k = Math.min((performance.now() - tween.start) / tween.ms, 1), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k >= 1) tween = null;
  }
  if (wear.connected && wear.real) {
    if (wear.q) pivot.quaternion.slerp(wear.q, 1 - Math.exp(-20 * dt));
    if (t - (wear.last || 0) > 0.12) { wear.last = t; updateDeviceReadout(); }
  } else if (wear.connected) {
    const prev = { yaw: wear.yaw, pitch: wear.pitch, roll: wear.roll };
    if (wear.auto) {
      wear.yaw = 28 * Math.sin(t * 0.45); wear.pitch = 14 * Math.sin(t * 0.33 + 1); wear.roll = 22 * Math.sin(t * 0.27 + 2);
    }
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
      THREE.MathUtils.degToRad(wear.pitch - wear.zero.pitch), THREE.MathUtils.degToRad(wear.yaw - wear.zero.yaw),
      THREE.MathUtils.degToRad(wear.roll - wear.zero.roll), "YXZ"));
    pivot.quaternion.slerp(q, 1 - Math.exp(-8 * dt));
    const noise = () => (Math.random() - 0.5) * 0.6;
    wear.gyro = ["pitch", "yaw", "roll"].map((a) => (wear[a] - prev[a]) / Math.max(dt, 1e-3) + noise());
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(pivot.quaternion.clone().invert());
    wear.accel = [up.x + noise() * 0.02, up.y + noise() * 0.02, up.z + noise() * 0.02];
    if (t - (wear.last || 0) > 0.12) { wear.last = t; updateDeviceReadout(); }
  } else {
    pivot.quaternion.slerp(new THREE.Quaternion(), 1 - Math.exp(-6 * dt));
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

const history = [];

function go(view) {

  if (!navigatingBack) history.push(state.view);

  location.hash = view;
}
function back() { if (!history.length) return; navigatingBack = true; const v = history.pop(); location.hash = v; }

  document.getElementById("backBtn").hidden = history.length === 0;
  document.getElementById("homeBtn").hidden = view === "showroom" || view === "welcome";

  host.innerHTML = "";

  VIEWS[view].render(host);
}

const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };

function rangeTrack(min, max, okMin, okMax) {
  const a = ((okMin - min) / (max - min)) * 100, b = ((okMax - min) / (max - min)) * 100;
  return `--track: linear-gradient(90deg, #4a2a2a 0%, #4a2a2a ${a}%, #2f4a3a ${a}%, #2f4a3a ${b}%, #4a2a2a ${b}%, #4a2a2a 100%)`;
}

function renderFitBox(el) {
  const f = checkFit();
  el.className = `fitbox ${f.status}`;
  el.innerHTML = `<b>${esc(f.title)}</b>${f.reasons.length ? `<ul>${f.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : `<ul><li>${esc(gemDef().displayName)} ${esc(shapeDef().displayName.toLowerCase())} sits correctly in the ${esc(ring().displayName)} head.</li></ul>`}`;
}

function snapshot() { return { ringId: state.ringId, gemId: state.gemId, shapeId: state.shapeId, lengthMm: state.lengthMm, widthMm: state.widthMm, seat: { ...state.seat }, metalId: state.metalId }; }
function restore(d) { Object.assign(state, { ...d, seat: { ...d.seat } }); syncStage(); }
function describe(d) {
  const r = ringById(d.ringId) || { displayName: "Removed custom design" };
  const g = byId(CAT.gemstones, d.gemId), s = byId(CAT.shapes, d.shapeId), m = byId(CAT.metals, d.metalId);
  return { title: `${r.displayName} · ${g.displayName}`, detail: `${s.displayName} ${d.lengthMm.toFixed(1)}×${d.widthMm.toFixed(1)} mm · ${m.displayName}`, color: g.colorHex };
}
function addCompare() {
  if (state.compare.length >= 4) state.compare.shift();
  state.compare.push(snapshot());
  toast(`Added to compare (${state.compare.length}/4).`);
  if (state.view === "inspect") show("inspect");
}

// ------------------------------------------------------------------------------------------ design from a photo
const round1 = (v) => Math.round(v * 10) / 10;
const clampNum = (v, lo, hi, d) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
const STYLE_TEXT = { solitaire: "Solitaire", halo: "Halo", three_stone: "Three-stone", bezel: "Bezel" };

function defaultSpec() {
  return { specVersion: 1, name: "My ring", style: "solitaire", prongs: 4, cathedral: false, headHeight: "medium", innerDiameterMm: 17.3,
           bandWidthMm: 2.0, bandThicknessMm: 1.7, stone: { gemId: "diamond", shapeId: "round", lengthMm: 6.5, widthMm: 6.5 },
           metalId: "yellow_gold", halo: { accentSizeMm: 1.3 }, sideStones: { sizeMm: 4.0 } };
}

/** Clamps whatever came back (from Claude or the form) to what the generator can build. */
function normalizeSpec(raw) {
  const d = defaultSpec(), r = raw || {}, st = r.stone || {};
  const style = ["solitaire", "halo", "three_stone", "bezel"].includes(r.style) ? r.style : d.style;
  const shapeId = CAT.shapes.some((s) => s.id === st.shapeId) ? st.shapeId : d.stone.shapeId;
  const shape = shapeDef(shapeId);
  let L = clampNum(st.lengthMm, shape.minLengthMm, shape.maxLengthMm, shape.defaultLengthMm);
  let W = clampNum(st.widthMm, 3, 10, shape.defaultWidthMm);
  if (shape.lockAspect) W = L;
  else if (W > L) [L, W] = [W, L];
  return {
    specVersion: 1,
    name: String(r.name || d.name).replace(/\s+/g, " ").trim().slice(0, 60) || d.name,
    style,
    prongs: [4, 6, 8].includes(Number(r.prongs)) ? Number(r.prongs) : 4,
    cathedral: !!r.cathedral && (style === "solitaire" || style === "three_stone"),
    headHeight: ["low", "medium", "high"].includes(r.headHeight) ? r.headHeight : style === "bezel" ? "low" : "medium",
    innerDiameterMm: 17.3,
    bandWidthMm: round1(clampNum(r.bandWidthMm, 1.6, 3.5, d.bandWidthMm)),
    bandThicknessMm: round1(clampNum(r.bandThicknessMm, 1.5, 2.4, d.bandThicknessMm)),
    stone: { gemId: CAT.gemstones.some((g) => g.id === st.gemId) ? st.gemId : d.stone.gemId, shapeId, lengthMm: round1(L), widthMm: round1(W) },
    metalId: CAT.metals.some((m) => m.id === r.metalId) ? r.metalId : d.metalId,
    halo: { accentSizeMm: round1(clampNum(r.halo?.accentSizeMm, 1.0, 1.8, 1.3)) },
    sideStones: { sizeMm: round1(clampNum(r.sideStones?.sizeMm, 3.0, 5.0, 4.0)) },
  };
}

/** A custom ring definition shaped like a rings.json entry, so fit checks, customising and saving all work. */
function makeRingDef(spec, id, extra = {}) {
  const st = spec.stone, shape = shapeDef(st.shapeId), depth = st.widthMm * depthRatio(st.shapeId);
  const style = {
    solitaire: `${spec.prongs}-prong solitaire${spec.cathedral ? " with cathedral shoulders" : ""}`,
    halo: "Halo with pave accent stones",
    three_stone: `Three-stone, ${spec.prongs}-prong centre${spec.cathedral ? ", cathedral shoulders" : ""}`,
    bezel: "Full bezel",
  }[spec.style];
  const mounts = [{
    id: "Center", role: "center", supportedShapes: CAT.shapes.map((s) => s.id),
    minLengthMm: round1(Math.max(shape.minLengthMm, st.lengthMm - 1.5)), maxLengthMm: round1(Math.min(shape.maxLengthMm, st.lengthMm + 1.5)),
    minWidthMm: round1(Math.max(3, st.widthMm - 1.2)), maxWidthMm: round1(st.widthMm + 1.2),
    maxDepthMm: Math.round((depth + 0.9) * 100) / 100,
    adjustRangeMm: spec.style === "bezel" ? { x: 0, y: 0.2, z: 0 } : { x: 0.3, y: 0.5, z: 0.3 },
  }];
  if (spec.style === "three_stone") {
    for (const sid of ["SideL", "SideR"]) {
      const s = spec.sideStones.sizeMm;
      mounts.push({ id: sid, role: "side", supportedShapes: ["round"], minLengthMm: s, maxLengthMm: s, minWidthMm: s, maxWidthMm: s,
                    maxDepthMm: s, adjustRangeMm: { x: 0, y: 0, z: 0 }, fixedGemstoneId: "diamond", fixedShapeId: "round", fixedLengthMm: s });
    }
  }
  return {
    id, custom: true, spec: JSON.parse(JSON.stringify(spec)), source: extra.source || "manual", photo: extra.photo || null,
    displayName: spec.name, settingStyle: style,
    description: extra.description || (extra.source === "photo" ? "Rebuilt from your photo." : "Designed by hand."),

let localPhotoStatus = null;

async function shrinkForUpload(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return { mediaType: "image/jpeg", data: c.toDataURL("image/jpeg", 0.9).split(",")[1] };
  } catch (e) { throw { code: "image_rejected" }; }
}
const localSample = {
  limits: async () => ({ images: { maxCount: 4, mediaTypes: ["image/jpeg", "image/png", "image/webp", "image/gif"] } }),
  json: async (prompt, opts = {}) => {
    const images = await Promise.all((opts.images || []).map(shrinkForUpload));
    let res;
    try {
      res = await fetch("/api/analyse-photo", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, images }), signal: opts.signal });
    } catch (e) { throw { code: e?.name === "AbortError" ? "cancelled" : "local_offline" }; }
    const answer = await res.json().catch(() => null);
    if (!answer?.ok) throw { code: answer?.code || "local_error", message: answer?.message };
    return answer.value;
  },
};
async function findLocalSample() {
  if (!LOCAL_HOSTS.includes(location.hostname)) return null;

    const res = await fetch("/api/photo-status", { cache: "no-store" });

  return localPhotoStatus?.available ? localSample : null;

async function makeThumb(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 240 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  } catch (e) { return null; }
}

async function analysePhoto() {
  const sample = await samplePromise;
  if (!sample || !photo.file) return;
  photo.busy = true; photo.message = "Reading the design... this usually takes 10-40 seconds."; photo.messageKind = "";
  photo.ctl = new AbortController();
  show("photo");
  try {
    const raw = await sample.json(photoPrompt(), { images: [photo.file], signal: photo.ctl.signal });
    if (!raw || raw.isRing === false) {
      photo.result = null;
      photo.message = `This photo doesn't seem to show a ring${raw?.reason ? `: ${raw.reason}` : "."} Try a clear photo of a single ring.`;
      photo.messageKind = "bad";
    } else {
      photo.result = raw;
      photo.spec = normalizeSpec(raw);
      photo.message = "Design read from your photo. Check the details below, adjust anything, then save it.";
      photo.messageKind = "ok";
      await previewDraft("photo");
    }
  } catch (e) {
    if (e?.code === "cancelled") { photo.message = "Stopped."; photo.messageKind = ""; }
    else {
      photo.message = ANALYSIS_ERRORS[e?.code] || "Something went wrong while reading the photo. Try again.";
      photo.messageKind = "bad";
      if (["not_granted", "sampling_disabled", "images_unavailable", "not_declared", "capability_disabled"].includes(e?.code)) photoAvailable = false;
    }
  } finally {
    photo.busy = false; photo.ctl = null;
    if (state.view === "photo") show("photo");
  }
}

}

// ---- real ESP32 over WiFi (WebSocket, port 81). Firmware: Firmware/ESP32/GemXpertWearable
const ESP_KEY = "gemxpert-esp32-host";
function savedEspHost() {
  try { return new URLSearchParams(location.search).get("esp") || localStorage.getItem(ESP_KEY) || ""; } catch (e) { return ""; }
}
function connectEsp(input, quiet = false) {
  const host = String(input || "").trim().replace(/^(wss?|https?):\/\//, "").replace(/\/.*$/, "");
  if (!host) { toast("Type the IP address the ESP32 printed on the Serial Monitor."); return; }
  if (wear.ws) { const old = wear.ws; wear.ws = null; old.close(); }
  if (wear.connected && !wear.real) wear.connected = false;   // leave the simulator
  wear.host = host;
  let sock;
  try { sock = new WebSocket(`ws://${host.includes(":") ? host : host + ":81"}/`); }
  catch (e) { toast("That address doesn't look right. Use the IP, e.g. 192.168.1.42."); return; }
  wear.ws = sock;
  let opened = false;
  setWearStatus(`Wearable: connecting to ${host}...`, false);
  sock.onopen = () => {
    opened = true;
    try { localStorage.setItem(ESP_KEY, host); } catch (e) { /* private mode */ }
    Object.assign(wear, { real: true, connected: true, auto: false, zero: { yaw: 0, pitch: 0, roll: 0 } });
    setWearStatus("Wearable: ESP32 live", true);
    setAutoRotate(false);
    toast("ESP32 connected. Rotate the sensor to turn the ring.");
    if (state.view === "wearable") show("wearable");
  };
  sock.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "imu") {
      // sensor axes (X right, Y forward, Z up) -> three.js axes (X right, Y up, Z towards you)
      wear.q = new THREE.Quaternion(m.q[1], m.q[3], -m.q[2], m.q[0]).normalize();
      [wear.yaw, wear.pitch, wear.roll] = m.e;
      wear.gyro = m.g; wear.accel = m.a; wear.packet = ev.data;
    } else if (m.type === "gesture") gesture(m.gesture);
  };
  sock.onclose = () => {
    if (wear.ws !== sock) return;           // replaced by a newer connection or disconnected on purpose
    wear.ws = null;
    const wasLive = wear.real;
    Object.assign(wear, { real: false, connected: false, q: null });
    setWearStatus(`Wearable: reconnecting to ${host}...`, false);
    if (state.view === "wearable") show("wearable");
    if (wasLive) toast("ESP32 connection lost. Reconnecting...");
    else if (!opened && !quiet) toast(`Can't reach the ESP32 at ${host}. Same WiFi? Right IP? Still trying...`);
    setTimeout(() => { if (!wear.ws && wear.host === host) connectEsp(host, true); }, 2000);
  };
}
function disconnectEsp() {
  wear.host = null;
  if (wear.ws) { const s = wear.ws; wear.ws = null; s.close(); }
  Object.assign(wear, { real: false, connected: false, q: null });
  setWearStatus("Wearable: not connected", false);
}

    : "Type the IP address the ESP32 prints on the Serial Monitor, then press Connect."}</p>
  <div class="device">
    <div class="device-top"><div><b id="devName">${wear.connected ? "GemXpert Ring Controller" : "No device connected"}</b><br><small class="hint" id="devSub">${live ? "ESP32 + MPU6050 · WiFi" : wear.connected ? "ESP32 + MPU6050 · BLE" : "Connect the ESP32 above, or try the simulator"}</small></div><span class="sim-badge" ${live ? 'style="color:var(--ok,#4cc38a);border-color:var(--ok,#4cc38a)"' : ""}>${live ? "Live" : "Simulated"}</span></div>
    <div class="row">
      ${live ? "" : `<button class="btn" style="flex:1" id="devConnect">${wear.connected ? "Stop simulator" : "Simulate instead"}</button>`}
      <button class="btn" style="flex:1" id="devCal" ${wear.connected ? "" : "disabled"}>Calibrate</button>
    </div>
    <div class="readout" id="readout">
      <span></span><span>X</span><span>Y</span><span>Z</span>
      <span>Gyro °/s</span><span id="gx">-</span><span id="gy">-</span><span id="gz">-</span>
      <span>Accel g</span><span id="ax">-</span><span id="ay">-</span><span id="az">-</span>
      <span>Orient °</span><span id="oy">-</span><span id="op">-</span><span id="or">-</span>
    </div>
    <div class="hint" id="devBattery">Battery: -</div>
  </div>
  <h2 class="section">Hand motion</h2>
  <label class="row" style="align-items:center;gap:8px"><input type="checkbox" id="devAuto" ${wear.auto ? "checked" : ""}> Simulate natural wrist movement</label>
  <div class="field"><div class="field-top"><label for="sRoll">Roll</label><span class="val" id="sRollV"></span></div><input type="range" id="sRoll" min="-60" max="60" step="1" value="${wear.roll.toFixed(0)}"></div>
  <div class="field"><div class="field-top"><label for="sPitch">Pitch</label><span class="val" id="sPitchV"></span></div><input type="range" id="sPitch" min="-45" max="45" step="1" value="${wear.pitch.toFixed(0)}"></div>
  <h2 class="section">Gestures</h2>
  <div class="row">
    <button class="btn" style="flex:1" data-gesture="tap">Tap</button>
    <button class="btn" style="flex:1" data-gesture="double">Double tap</button>
    <button class="btn" style="flex:1" data-gesture="swipe">Swipe</button>
  </div>
  <p class="note">Tap shows the next gemstone, double tap the next metal, swipe the next ring design.</p>
  <h2 class="section">Data packet (JSON prototype format)</h2>
  <pre class="packet" id="packet">{ "connect to see live packets": true }</pre>
  <p class="note">This page simulates the wearable so the interface can be tried without hardware. The VR build connects to the real ESP32 over Bluetooth LE. The IMU supplies orientation and gestures. Hand position always comes from the headset's hand tracking.</p>`));
  const espInput = host.querySelector("#espHost");
  host.querySelector("#espConnect").onclick = () => {
    if (wear.ws || wear.real) { disconnectEsp(); show("wearable"); return; }
    connectEsp(espInput.value);
    show("wearable");
  };
  espInput.addEventListener("keydown", (e) => { if (e.key === "Enter") host.querySelector("#espConnect").click(); });
  if (live) {
    host.querySelector("#devCal").onclick = () => { wear.ws?.send("recentre"); toast("Calibrated: the current pose is now straight."); };
    host.querySelectorAll("#devAuto, #sRoll, #sPitch").forEach((el) => { el.disabled = true; });
    updateDeviceReadout();
    return;
  }
  host.querySelector("#devConnect").onclick = () => {
    if (wear.connected) { wear.connected = false; setWearStatus("Wearable: not connected", false); show("wearable"); return; }
    if (wear.ws) disconnectEsp();
    const btn = host.querySelector("#devConnect"); btn.disabled = true; btn.textContent = "Scanning...";
    setTimeout(() => { btn.textContent = "Connecting to GemXpert-Ring-01..."; }, 700);
    setTimeout(() => { wear.connected = true; setWearStatus("Wearable: connected (simulated)", true); setAutoRotate(false); show("wearable"); toast("GemXpert-Ring-01 connected (simulated)."); }, 1500);
  };
  host.querySelector("#devCal").onclick = () => { wear.zero = { yaw: wear.yaw, pitch: wear.pitch, roll: wear.roll }; toast("Calibrated: the current hand pose is now neutral."); };
  const auto = host.querySelector("#devAuto"), roll = host.querySelector("#sRoll"), pitch = host.querySelector("#sPitch");
  const syncSliders = () => {
    wear.auto = auto.checked; roll.disabled = pitch.disabled = wear.auto;
    if (!wear.auto) { wear.roll = +roll.value; wear.pitch = +pitch.value; }
    host.querySelector("#sRollV").textContent = `${(+roll.value).toFixed(0)}°`;
    host.querySelector("#sPitchV").textContent = `${(+pitch.value).toFixed(0)}°`;
  };
  [auto, roll, pitch].forEach((el) => el.addEventListener("input", syncSliders));
  syncSliders();
  updateDeviceReadout();
}

function updateDeviceReadout() {
  if (state.view !== "wearable" || !wear.connected || !wear.gyro) return;
  const set = (id, v, d = 1) => { const el = document.getElementById(id); if (el) el.textContent = v.toFixed(d); };
  set("gx", wear.gyro[0]); set("gy", wear.gyro[1]); set("gz", wear.gyro[2]);
  set("ax", wear.accel[0], 2); set("ay", wear.accel[1], 2); set("az", wear.accel[2], 2);
  set("oy", wear.yaw - wear.zero.yaw); set("op", wear.pitch - wear.zero.pitch); set("or", wear.roll - wear.zero.roll);
  const b = document.getElementById("devBattery");
  const pk = document.getElementById("packet");
  if (wear.real) {
    if (b) b.textContent = "Live from the ESP32 · 50 Hz";
    if (pk && wear.packet) pk.textContent = wear.packet;
    return;
  }
  wear.battery = Math.max(5, wear.battery - 0.0004);
  if (b) b.textContent = `Battery: ${wear.battery.toFixed(0)}% (simulated) · 50 Hz`;
  if (pk) pk.textContent = JSON.stringify({ t: Math.round(performance.now()), g: wear.gyro.map((v) => +v.toFixed(1)), a: wear.accel.map((v) => +v.toFixed(3)),
    e: [+(wear.yaw - wear.zero.yaw).toFixed(1), +(wear.pitch - wear.zero.pitch).toFixed(1), +(wear.roll - wear.zero.roll).toFixed(1)], bat: Math.round(wear.battery) });
}

function setWearStatus(text, on) {
  document.getElementById("wearText").textContent = text;
  document.getElementById("wearDot").classList.toggle("on", on);
  document.getElementById("footStatus").textContent = on ? (wear.real ? "Wearable connected (ESP32 live)" : "Wearable connected (simulated)") : "Browser preview";
}

function gesture(kind) {
  if (!wear.connected) { toast("Connect the wearable first."); return; }
  const cycle = (list, cur) => list[(list.indexOf(cur) + 1) % list.length];
  if (kind === "tap") { state.gemId = cycle(CAT.gemstones.map((g) => g.id), state.gemId); toast(`Tap: ${gemDef().displayName}`); }
  if (kind === "double") { state.metalId = cycle(CAT.metals.map((m) => m.id), state.metalId); toast(`Double tap: ${metalDef().displayName}`); }
  if (kind === "swipe") {
    const list = [...CAT.rings, ...customRings];
    const next = ringById(cycle(list.map((r) => r.id), state.ringId));
    const keepGem = state.gemId, keepMetal = state.metalId;
    applyRingDefaults(next); state.gemId = keepGem; state.metalId = keepMetal;
    toast(`Swipe: ${next.displayName}`);
  }
  syncStage();
}

// one delegated click handler for all screens
document.getElementById("screen").addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.go) go(d.go);
  else if (d.ring) {
    const r = ringById(d.ring);
    if (!r) return;
    applyRingDefaults(r);
    syncStage(); show(state.view); toast(`${r.displayName} with ${gemDef().displayName} ${shapeDef().displayName.toLowerCase()} in ${metalDef().displayName}.`);
  } else if (d.gem) { state.gemId = d.gem; syncStage(); show("gemstones"); }
  else if (d.shape) { setShape(d.shape); syncStage(); show("gemstones"); }
  else if (d.metal) { state.metalId = d.metal; syncStage(); show("customise"); }
  else if (d.cmp !== undefined) { restore(state.compare[+d.cmp]); show("inspect"); }
  else if (d.restore !== undefined) { restore(loadSaved()[+d.restore].design); toast("Design restored."); go("summary"); }
  else if (d.cmpsaved !== undefined) { state.compare.push(loadSaved()[+d.cmpsaved].design); if (state.compare.length > 4) state.compare.shift(); toast("Added to compare."); go("inspect"); }
  else if (d.del !== undefined) {
    const row = t.parentElement;
    row.innerHTML = `<span style="flex:1;align-self:center">Delete this design?</span><button class="btn" data-delyes="${d.del}">Delete</button><button class="btn" data-delno="1">Keep</button>`;
  } else if (d.delyes !== undefined) { const list = loadSaved(); list.splice(+d.delyes, 1); storeSaved(list); show("saved"); }
  else if (d.delno) show("saved");
  else if (d.gesture) gesture(d.gesture);
  else if (d.cdel) {
    t.parentElement.innerHTML = `<span style="flex:1;align-self:center">Remove this design?</span><button class="btn" data-cdelyes="${esc(d.cdel)}">Remove</button><button class="btn" data-cdelno="1">Keep</button>`;
  } else if (d.cdelyes) {
    customRings = customRings.filter((r) => r.id !== d.cdelyes);
    storeCustomRings();
    if (state.ringId === d.cdelyes) { applyRingDefaults(CAT.rings[0]); syncStage(); }
    show(state.view);
  } else if (d.cdelno) show(state.view);
});

// ------------------------------------------------------------------------------------------ boot
async function boot() {
  const loading = document.getElementById("loading");
  try {
    const names = ["rings", "gemstones", "shapes", "metals"];
    const [rings, gemstones, shapes, metals, meta] = await Promise.all(
      [...names.map((n) => getJSON(`data/${n}.json`)), getJSON("data/asset_metadata.json")]);
    CAT = { rings: rings.items, gemstones: gemstones.items, shapes: shapes.items, metals: metals.items };
    META = meta;
  } catch (err) {
    console.error(err);
    loading.textContent = "The catalogue could not be loaded. Reload the page to try again.";
    document.getElementById("screen").innerHTML = `<div class="empty">GemXpert couldn't load its catalogue. Reload the page to try again.</div>`;
    return;
  }
  loadCustomRings();
  checkPhotoAvailability();   // resolves later; the photo screen re-renders when it knows
  applyRingDefaults(byId(CAT.rings, "solitaire"));
  // The panel works from the catalogue alone, so show it before the 3D models finish loading.
  show(location.hash.slice(1) || "welcome");
  resize();
  if (savedEspHost()) connectEsp(savedEspHost(), true);   // reconnect to the last ESP32 automatically
  try {
    await syncStage();
    tick();
    loading.classList.add("done");
  } catch (err) {
    console.error(err);
    loading.textContent = "The 3D models could not be loaded. The panel still works. Reload to try the 3D view again.";
  }
}
boot();
</script>
